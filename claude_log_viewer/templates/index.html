<!DOCTYPE html>
<html lang="en" class="dark h-full antialiased overflow-x-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Log Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Geist','sans-serif'], mono: ['"JetBrains Mono"','monospace'] },
                    colors: { anthropic: '#d97d54' }
                }
            }
        }
    </script>
    <style>
        :root { --syn-kw:#d73a49;--syn-fn:#6f42c1;--syn-cm:#6e7781;--syn-cn:#0550ae; }
        .dark { --syn-kw:#ff7b72;--syn-fn:#d2a8ff;--syn-cm:#8b949e;--syn-cn:#79c0ff; }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        details[open] summary .caret { transform: rotate(90deg); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        .dark ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
        ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 3px; }

        /* Playback animation */
        @keyframes msg-appear {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .msg-hidden { opacity: 0; }
        .msg-animate { animation: msg-appear 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .msg-visible { opacity: 1; }

        /* Reload spin */
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Speed slider styling */
        .speed-slider { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; outline: none; cursor: pointer; }
        .speed-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; cursor: pointer; }
        .dark .speed-slider { background: #3f3f46; }
        .speed-slider { background: #d4d4d8; }
        .dark .speed-slider::-webkit-slider-thumb { background: #d97d54; }
        .speed-slider::-webkit-slider-thumb { background: #d97d54; }

        /* Long text wrap (URLs etc) */
        .msg-wrap { overflow-wrap: anywhere; word-break: break-word; }

        /* Line clamp fallback */
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* Search highlight */
        mark.search-hit { background: #fbbf24; color: #000; border-radius: 2px; padding: 0 1px; }
        .dark mark.search-hit { background: #b45309; color: #fff; }
        mark.search-hit.current { background: #f97316; }
        .dark mark.search-hit.current { background: #ea580c; }

        /* Message selection for quote */
        .msg-selected { outline: 2px solid #d97d54; outline-offset: 2px; border-radius: 8px; }
        .msg-select-check { display: none; }
        .quote-mode .msg-select-check { display: flex; opacity: 0.3; }
        .quote-mode .msg-selected .msg-select-check { opacity: 1; }
        .quote-mode [data-role] { cursor: pointer; }
        .quote-mode-active { color: #d97d54 !important; background: rgba(217, 125, 84, 0.1) !important; }
    </style>
</head>
<body class="flex h-full overflow-hidden overflow-x-hidden bg-white dark:bg-[#09090b] text-zinc-800 dark:text-zinc-300 transition-colors duration-300">

    <!-- SIDEBAR OVERLAY (mobile) -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/40 z-30 hidden md:hidden" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="w-72 flex-shrink-0 flex flex-col bg-zinc-50 dark:bg-zinc-900/30 border-r border-zinc-200 dark:border-zinc-800 transition-all duration-300 fixed inset-y-0 left-0 z-40 -translate-x-full md:relative md:translate-x-0">
        <div class="h-14 flex items-center px-4 border-b border-zinc-200 dark:border-zinc-800 gap-2">
            <i class="ph-fill ph-terminal-window text-anthropic text-xl"></i>
            <span class="font-semibold text-sm text-zinc-800 dark:text-zinc-100" data-i18n="title">Claude Log Viewer</span>
            <button class="ml-auto p-1 rounded text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 md:hidden" onclick="toggleSidebar()" title="Close sidebar">
                <i class="ph ph-x text-lg"></i>
            </button>
        </div>
        <div class="border-b border-zinc-200 dark:border-zinc-800">
            <div class="flex px-3 pt-2 gap-1">
                <button id="search-tab-session" class="search-tab flex-1 text-[11px] font-medium py-1 rounded-t-md transition-colors border-b-2 border-anthropic text-zinc-800 dark:text-zinc-100" onclick="setSearchMode('session')">
                    <span data-i18n="search_tab_session">セッション名</span>
                </button>
                <button id="search-tab-content" class="search-tab flex-1 text-[11px] font-medium py-1 rounded-t-md transition-colors border-b-2 border-transparent text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-400" onclick="setSearchMode('content')">
                    <span data-i18n="search_tab_content">本文</span>
                </button>
                <button id="reload-btn" class="flex-shrink-0 p-1 rounded-md text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 hover:bg-zinc-200 dark:hover:bg-zinc-800 transition-colors" title="Reload sessions">
                    <i class="ph ph-arrows-clockwise text-sm"></i>
                </button>
            </div>
            <div class="px-3 py-2 flex gap-2">
                <div class="relative flex-1">
                    <i id="search-icon" class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400 text-sm"></i>
                    <i id="search-spinner" class="ph ph-spinner ph-spin absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400 text-sm hidden"></i>
                    <input id="search" type="text" class="w-full bg-white dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-800 rounded-md py-1.5 pl-8 pr-3 text-xs text-zinc-800 dark:text-zinc-300 placeholder-zinc-400 font-mono focus:outline-none focus:border-zinc-400 dark:focus:border-zinc-600 transition-colors" data-i18n-placeholder="search_placeholder">
                </div>
            </div>
            <div id="search-hit-count" class="hidden px-3 pb-2 text-[10px] font-mono text-zinc-400"></div>
        </div>
        <div id="session-list" class="flex-1 overflow-y-auto py-2">
            <div class="text-xs text-zinc-400 px-4 py-4" data-i18n="loading">Loading...</div>
        </div>
        <div class="relative flex items-center gap-1 px-4 py-2 border-t border-zinc-200 dark:border-zinc-800">
            <button id="lang-toggle" class="px-2 py-1 rounded text-[11px] font-mono text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-200 hover:bg-zinc-200 dark:hover:bg-zinc-800 transition-colors">EN</button>
            <button id="theme-toggle" class="p-2 rounded-md text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-200 hover:bg-zinc-200 dark:hover:bg-zinc-800 transition-colors" title="Toggle theme">
                <i class="ph ph-sun text-lg" id="icon-light"></i>
                <i class="ph ph-moon text-lg hidden" id="icon-dark"></i>
                <span id="icon-auto" class="hidden text-[10px] font-mono font-bold">AUTO</span>
            </button>
            <button id="quote-names-btn" class="p-2 rounded-md text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-200 hover:bg-zinc-200 dark:hover:bg-zinc-800 transition-colors" title="Quote display names" onclick="toggleQuoteNamesPopover()">
                <i class="ph ph-user-circle text-lg"></i>
            </button>
            <!-- Quote names popover -->
            <div id="quote-names-popover" class="hidden absolute bottom-full left-0 mb-2 ml-2 bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-lg shadow-lg p-3 z-30 w-56">
                <div class="text-xs font-medium text-zinc-600 dark:text-zinc-300 mb-2" data-i18n="quote_names_title">Quote Display Names</div>
                <label class="block text-[11px] text-zinc-500 dark:text-zinc-400 mb-1">User</label>
                <input id="quote-user-name" type="text" maxlength="20" placeholder="User" class="w-full px-2 py-1 mb-2 text-xs rounded border border-zinc-200 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-900 text-zinc-800 dark:text-zinc-200 outline-none focus:border-zinc-400 dark:focus:border-zinc-500">
                <label class="block text-[11px] text-zinc-500 dark:text-zinc-400 mb-1">Agent</label>
                <input id="quote-agent-name" type="text" maxlength="20" placeholder="Agent" class="w-full px-2 py-1 mb-3 text-xs rounded border border-zinc-200 dark:border-zinc-700 bg-zinc-50 dark:bg-zinc-900 text-zinc-800 dark:text-zinc-200 outline-none focus:border-zinc-400 dark:focus:border-zinc-500">
                <button onclick="saveQuoteNames()" class="w-full px-2 py-1 bg-zinc-800 dark:bg-zinc-100 text-zinc-100 dark:text-zinc-800 text-xs font-medium rounded hover:bg-zinc-700 dark:hover:bg-zinc-200 transition-colors" data-i18n="save">Save</button>
            </div>
        </div>
    </aside>

    <!-- MAIN -->
    <main class="flex-1 flex flex-col min-w-0">
        <header class="flex flex-col border-b border-zinc-200 dark:border-zinc-800 bg-white/80 dark:bg-[#09090b]/80 backdrop-blur-lg sticky top-0 z-10 transition-colors duration-300">
            <!-- Row 1: Title + Rename -->
            <div class="flex items-center gap-2 px-4 md:px-6 h-11 min-w-0">
                <button id="sidebar-toggle" class="p-1.5 rounded-md text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors md:hidden" onclick="toggleSidebar()" title="Open sidebar">
                    <i class="ph ph-list text-lg"></i>
                </button>
                <h1 id="session-title" class="text-sm font-medium text-zinc-900 dark:text-zinc-100 truncate min-w-0" data-i18n="select_session">Select a session</h1>
                <button id="rename-btn" class="hidden flex-shrink-0 p-1 rounded text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors" title="Rename session">
                    <i class="ph ph-pencil text-sm"></i>
                </button>
            </div>
            <!-- Row 2: Token badge + Quote + Reload + Playback toggle -->
            <div id="header-row2" class="hidden items-center gap-2 px-4 md:px-6 h-9 border-t border-zinc-100 dark:border-zinc-800/50">
                <span id="token-badge" class="hidden px-2 py-0.5 rounded bg-zinc-100 dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 text-[10px] font-mono text-zinc-500 dark:text-zinc-400 flex-shrink-0 whitespace-nowrap"></span>
                <div class="flex-1"></div>
                <button id="quote-mode-btn" class="flex-shrink-0 p-1.5 rounded-md text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors" onclick="toggleQuoteMode()" title="Quote mode">
                    <i class="ph ph-quotes text-sm"></i>
                </button>
                <button id="reload-btn" class="flex-shrink-0 p-1.5 rounded-md text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors" onclick="reloadSession()" title="Reload session">
                    <i class="ph ph-arrows-clockwise text-sm"></i>
                </button>
                <button id="playback-toggle" class="flex-shrink-0 p-1.5 rounded-md text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors" onclick="togglePlaybackPanel()" title="Playback controls">
                    <i class="ph ph-caret-down text-sm" id="playback-toggle-icon"></i>
                </button>
            </div>
            <!-- Row 3: Playback controls (collapsible) -->
            <div id="playback-panel" class="overflow-hidden transition-all duration-300 ease-in-out" style="max-height: 0;">
                <div class="flex items-center gap-3 px-4 md:px-6 h-10 border-t border-zinc-100 dark:border-zinc-800/50">
                    <button id="playback-btn" class="flex-shrink-0 p-1.5 rounded-md text-zinc-400 hover:text-anthropic hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors" title="Play / Pause">
                        <i class="ph ph-play text-sm" id="playback-icon"></i>
                    </button>
                    <button id="stop-btn" class="hidden flex-shrink-0 p-1.5 rounded-md text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors" title="Stop">
                        <i class="ph ph-stop text-sm"></i>
                    </button>
                    <div class="flex items-center gap-2 flex-1">
                        <i class="ph ph-gauge text-xs text-zinc-400"></i>
                        <input id="speed-slider" type="range" min="1" max="20" value="10" class="speed-slider flex-1 max-w-[120px]">
                        <span id="speed-label" class="text-[10px] font-mono text-zinc-400 w-8">1.0x</span>
                    </div>
                </div>
            </div>
        </header>

        <div class="relative flex-1 min-h-0">
            <div id="chat" class="h-full overflow-y-auto overflow-x-hidden px-4 md:px-10 py-8 flex flex-col gap-6">
                <div class="flex flex-col items-center justify-center h-full text-zinc-400 dark:text-zinc-600 text-sm gap-2">
                    <i class="ph ph-chat-dots text-4xl"></i>
                    <span data-i18n="empty_state">Select a session from the sidebar</span>
                </div>
            </div>
            <div id="highlight-nav" class="hidden absolute bottom-4 right-6 flex items-center gap-1.5 bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-lg shadow-lg px-3 py-1.5 z-20">
                <span id="highlight-counter" class="text-xs font-mono text-zinc-500 dark:text-zinc-400 min-w-[3ch] text-center"></span>
                <button onclick="jumpHighlight(-1)" class="p-1 rounded text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors" title="Previous hit">
                    <i class="ph ph-caret-up text-base"></i>
                </button>
                <button onclick="jumpHighlight(1)" class="p-1 rounded text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors" title="Next hit">
                    <i class="ph ph-caret-down text-base"></i>
                </button>
                <button onclick="clearHighlights()" class="p-1 rounded text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors" title="Clear">
                    <i class="ph ph-x text-base"></i>
                </button>
            </div>
            <div id="quote-bar" class="hidden absolute bottom-4 left-1/2 -translate-x-1/2 flex items-center gap-2 bg-white dark:bg-zinc-800 border border-zinc-200 dark:border-zinc-700 rounded-lg shadow-lg px-4 py-2 z-20">
                <span id="quote-count" class="text-xs font-mono text-zinc-500 dark:text-zinc-400"></span>
                <button onclick="copyQuoted()" class="px-3 py-1 bg-zinc-800 dark:bg-zinc-100 text-zinc-100 dark:text-zinc-800 text-xs font-medium rounded-md hover:bg-zinc-700 dark:hover:bg-zinc-200 transition-colors" data-i18n="copy_quote">Copy</button>
                <button onclick="clearSelection()" class="p-1 rounded text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors" title="Clear selection">
                    <i class="ph ph-x text-base"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- RENAME MODAL -->
    <div id="rename-modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
        <div class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-700 rounded-xl shadow-2xl w-[400px] p-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-sm font-semibold text-zinc-800 dark:text-zinc-100" data-i18n="rename_title">Rename Session</h2>
                <button id="rename-close" class="text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200"><i class="ph ph-x text-lg"></i></button>
            </div>
            <div class="relative mb-1">
                <input id="rename-input" type="text" maxlength="30" class="w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-700 rounded-md py-2 px-3 text-sm text-zinc-800 dark:text-zinc-200 focus:outline-none focus:border-zinc-400 dark:focus:border-zinc-500 transition-colors pr-16">
                <span id="rename-count" class="absolute right-3 top-1/2 -translate-y-1/2 text-[11px] font-mono text-zinc-400">0/30</span>
            </div>
            <div class="flex justify-end gap-2 mt-4">
                <button id="rename-cancel" class="px-3 py-1.5 text-xs text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-200 transition-colors" data-i18n="cancel">Cancel</button>
                <button id="rename-save" class="px-3 py-1.5 bg-zinc-800 dark:bg-zinc-100 text-zinc-100 dark:text-zinc-800 text-xs font-medium rounded-md hover:bg-zinc-700 dark:hover:bg-zinc-200 transition-colors" data-i18n="save">Save</button>
            </div>
        </div>
    </div>


    <script>
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');
        const isOpen = !sidebar.classList.contains('-translate-x-full');
        if (isOpen) {
            sidebar.classList.add('-translate-x-full');
            overlay.classList.add('hidden');
        } else {
            sidebar.classList.remove('-translate-x-full');
            overlay.classList.remove('hidden');
        }
    }

    const selectedMessages = new Set();
    let quoteMode = false;

    function toggleQuoteMode() {
        quoteMode = !quoteMode;
        const chat = document.getElementById('chat');
        const btn = document.getElementById('quote-mode-btn');
        if (quoteMode) {
            chat.classList.add('quote-mode');
            btn.classList.add('quote-mode-active');
        } else {
            chat.classList.remove('quote-mode');
            btn.classList.remove('quote-mode-active');
            clearSelection();
        }
    }

    function toggleMsgSelect(el, event) {
        if (!quoteMode) return;
        if (event && event.target.closest('button, summary, a, input, details')) return;
        const idx = el.getAttribute('data-msg-index');
        if (selectedMessages.has(idx)) {
            selectedMessages.delete(idx);
            el.classList.remove('msg-selected');
        } else {
            selectedMessages.add(idx);
            el.classList.add('msg-selected');
        }
        updateQuoteBar();
    }

    function updateQuoteBar() {
        const bar = document.getElementById('quote-bar');
        const count = selectedMessages.size;
        if (count === 0) {
            bar.classList.add('hidden');
            return;
        }
        bar.classList.remove('hidden');
        document.getElementById('quote-count').textContent = `${count} ${t('quote_selected')}`;
    }

    function clearSelection() {
        selectedMessages.clear();
        document.querySelectorAll('.msg-selected').forEach(el => el.classList.remove('msg-selected'));
        updateQuoteBar();
    }

    function copyToClipboard(text) {
        if (navigator.clipboard && window.isSecureContext) {
            return navigator.clipboard.writeText(text);
        }
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        return Promise.resolve();
    }

    function copyQuoted() {
        const msgs = [];
        const sorted = [...selectedMessages].sort((a,b) => Number(a) - Number(b));
        sorted.forEach(idx => {
            const el = document.querySelector(`[data-msg-index="${idx}"][data-role]`);
            if (!el) return;
            const role = el.getAttribute('data-role');
            const text = el.getAttribute('data-text');
            const label = role === 'user'
                ? (localStorage.getItem('quote_user_name') || 'User')
                : (localStorage.getItem('quote_agent_name') || 'Agent');
            msgs.push(`${label}: ${text}`);
        });
        const result = msgs.join('\n\n');
        copyToClipboard(result).then(() => {
            const btn = document.querySelector('#quote-bar button');
            const orig = btn.textContent;
            btn.textContent = t('copied');
            setTimeout(() => { btn.textContent = orig; }, 1500);
        }).catch(() => {
            console.warn('Clipboard write failed');
        });
    }

    const TRANSLATIONS = {
        en: {
            title: "Claude Log Viewer", loading: "Loading...",
            search_placeholder: "Search by session name...",
            search_placeholder_content: "Search in messages (Enter)",
            search_tab_session: "Session Name",
            search_tab_content: "Content",
            rename_title: "Rename Session", cancel: "Cancel", save: "Save",
            select_session: "Select a session",
            empty_state: "Select a session from the sidebar",
            today: "Today", yesterday: "Yesterday",
            tokens: "tokens", turns: "turns",
            manage_paths: "Manage Log Paths", add: "Add",
            default_path: "Default",
            rename_prompt: "New session name:",
            tool_bash: "Bash", tool_read: "Read", tool_edit: "Edit",
            tool_write: "Write", tool_glob: "Glob", tool_grep: "Grep",
            tool_agent: "Agent", tool_other: "Tool",
            tool_search: "Search", tool_task: "Task",
            quote_selected: "selected", copy_quote: "Copy", copied: "Copied!",
            quote_names_title: "Quote Display Names",
        },
        ja: {
            title: "Claude ログビューアー", loading: "読み込み中...",
            search_placeholder: "セッション名から検索...",
            search_placeholder_content: "本文を検索（Enter）",
            search_tab_session: "セッション名",
            search_tab_content: "本文",
            rename_title: "セッション名を変更", cancel: "キャンセル", save: "保存",
            select_session: "セッションを選択",
            empty_state: "サイドバーからセッションを選択してください",
            today: "今日", yesterday: "昨日",
            tokens: "トークン", turns: "ターン",
            manage_paths: "ログパスの管理", add: "追加",
            default_path: "デフォルト",
            rename_prompt: "セッション名を変更:",
            tool_bash: "Bash", tool_read: "Read", tool_edit: "Edit",
            tool_write: "Write", tool_glob: "Glob", tool_grep: "Grep",
            tool_agent: "Agent", tool_other: "ツール",
            tool_search: "Search", tool_task: "Task",
            quote_selected: "件選択中", copy_quote: "コピー", copied: "コピー済み!",
            quote_names_title: "引用時の表示名",
        }
    };

    let lang = localStorage.getItem('lang') || 'en';
    let currentSession = null;
    let allSessions = [];
    // Track collapsed state per project key
    const collapsedProjects = new Set();

    // Search state
    let searchMode = 'session'; // 'session' | 'content'
    let contentSearchResults = null; // [{session_id, project_dir, hit_count, hits}]
    let currentHighlightIndex = -1;
    let contentSearchQuery = '';

    // Playback state: 'idle' | 'playing' | 'paused'
    let playbackState = 'idle';
    let playbackTimer = null;
    let playbackIndex = 0; // next message to reveal
    let playbackSpeed = 1.0; // 1.0x = 1000ms base delay per message

    function t(key) { return TRANSLATIONS[lang][key] || key; }

    function applyI18n() {
        document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => el.placeholder = t(el.dataset.i18nPlaceholder));
        document.getElementById('lang-toggle').textContent = lang === 'en' ? 'JA' : 'EN';
        document.documentElement.lang = lang;
        // Update search placeholder based on current mode
        updateSearchPlaceholder();
    }

    function updateSearchPlaceholder() {
        const input = document.getElementById('search');
        input.placeholder = searchMode === 'session' ? t('search_placeholder') : t('search_placeholder_content');
    }

    function toolLabel(name) {
        const map = { Bash: t('tool_bash'), Read: t('tool_read'), Edit: t('tool_edit'),
            Write: t('tool_write'), Glob: t('tool_glob'), Grep: t('tool_grep'),
            Agent: t('tool_agent'), WebSearch: t('tool_search'), WebFetch: t('tool_search'),
            TaskCreate: t('tool_task'), TaskUpdate: t('tool_task'), };
        return map[name] || name;
    }

    function toolColor(name) {
        const map = {
            Bash: 'text-blue-700 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/20',
            Read: 'text-green-700 dark:text-green-400 bg-green-50 dark:bg-green-900/20',
            Edit: 'text-purple-700 dark:text-purple-400 bg-purple-50 dark:bg-purple-900/20',
            Write: 'text-purple-700 dark:text-purple-400 bg-purple-50 dark:bg-purple-900/20',
            Glob: 'text-yellow-700 dark:text-yellow-400 bg-yellow-50 dark:bg-yellow-900/20',
            Grep: 'text-yellow-700 dark:text-yellow-400 bg-yellow-50 dark:bg-yellow-900/20',
            Agent: 'text-pink-700 dark:text-pink-400 bg-pink-50 dark:bg-pink-900/20',
        };
        return map[name] || 'text-zinc-500 dark:text-zinc-400 bg-zinc-100 dark:bg-zinc-800';
    }

    function toolIcon(name) {
        const map = { Bash: 'ph-terminal-window', Read: 'ph-file-code', Edit: 'ph-pencil-simple',
            Write: 'ph-pencil-line', Glob: 'ph-folder-open', Grep: 'ph-magnifying-glass',
            Agent: 'ph-robot', WebSearch: 'ph-globe', WebFetch: 'ph-globe',
            TaskCreate: 'ph-check-square', TaskUpdate: 'ph-check-square', };
        return map[name] || 'ph-wrench';
    }

    function escapeHtml(str) {
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function linkifyUrls(escapedHtml) {
        return escapedHtml.replace(
            /https?:\/\/[^\s<>&"')\]`]+/g,
            url => {
                // Strip trailing punctuation that's likely not part of the URL
                const clean = url.replace(/[.,;:!?]+$/, '');
                const tail = url.slice(clean.length);
                return `<a href="${clean}" target="_blank" rel="noopener noreferrer" class="text-blue-600 dark:text-blue-400 underline underline-offset-2 hover:text-blue-800 dark:hover:text-blue-300 break-all" onclick="event.stopPropagation()">${clean}</a>${tail}`;
            }
        );
    }

    function formatDate(isoStr) {
        const d = new Date(isoStr);
        const today = new Date(); today.setHours(0,0,0,0);
        const yesterday = new Date(today); yesterday.setDate(today.getDate()-1);
        const target = new Date(d); target.setHours(0,0,0,0);

        if (target >= today) return t('today');
        if (target >= yesterday) return t('yesterday');

        const weekdays = lang === 'ja'
            ? ['日','月','火','水','木','金','土']
            : ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        const wd = weekdays[d.getDay()];

        if (lang === 'ja') {
            return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 (${wd})`;
        }
        return d.toLocaleDateString('en-US', {year:'numeric', month:'short', day:'numeric'}) + ` (${wd})`;
    }

    function renderItem(item) {
        if (item.type === 'text') {
            return `<div class="text-sm text-zinc-700 dark:text-zinc-300 leading-relaxed whitespace-pre-wrap msg-wrap">${linkifyUrls(escapeHtml(item.text))}</div>`;
        }
        if (item.type === 'tool_use') {
            const label = toolLabel(item.name);
            const color = toolColor(item.name);
            const icon = toolIcon(item.name);
            const cmd = escapeHtml(String(item.cmd || '').slice(0, 120));
            const full = escapeHtml(JSON.stringify(item.input, null, 2));
            return `<details class="bg-white dark:bg-[#131316] border border-zinc-200 dark:border-zinc-800 rounded-md font-mono text-xs overflow-hidden w-full max-w-2xl">
                <summary class="flex items-center gap-2 px-3 py-1.5 cursor-pointer hover:bg-zinc-50 dark:hover:bg-zinc-800/50 select-none transition-colors">
                    <i class="ph-bold ph-caret-right caret text-[10px] text-zinc-400 dark:text-zinc-600 transition-transform duration-150"></i>
                    <div class="flex items-center gap-1.5 ${color} px-1.5 rounded-sm flex-shrink-0">
                        <i class="ph ${icon}"></i><span class="font-medium">${label}</span>
                    </div>
                    <span class="text-zinc-600 dark:text-zinc-400 truncate flex-1">${cmd}</span>
                </summary>
                <div class="p-3 border-t border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-black/60 text-zinc-600 dark:text-zinc-400 overflow-x-auto whitespace-pre text-[11px] leading-relaxed">${full}</div>
            </details>`;
        }
        if (item.type === 'tool_result') {
            return `<div class="text-[11px] font-mono text-zinc-500 bg-zinc-50 dark:bg-zinc-900/50 border border-zinc-100 dark:border-zinc-800 rounded px-2 py-1 whitespace-pre-wrap msg-wrap max-w-2xl overflow-x-auto">${escapeHtml(item.text)}</div>`;
        }
        return '';
    }

    function formatTimestamp(timestamp) {
        if (!timestamp) return '';
        const d = new Date(timestamp);
        const locale = lang === 'ja' ? 'ja-JP' : 'en-US';
        const month = d.getMonth() + 1;
        const day = d.getDate();
        const time = d.toLocaleTimeString(locale, {hour:'2-digit', minute:'2-digit'});
        return `${month}/${day} ${time}`;
    }

    function getDateKey(timestamp) {
        if (!timestamp) return '';
        const d = new Date(timestamp);
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function renderDateSeparator(timestamp) {
        const d = new Date(timestamp);
        const locale = lang === 'ja' ? 'ja-JP' : 'en-US';
        const label = d.toLocaleDateString(locale, { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
        return `<div class="flex items-center gap-3 my-4"><div class="flex-1 h-px bg-zinc-200 dark:bg-zinc-700"></div><span class="text-[11px] font-mono text-zinc-400 dark:text-zinc-500 whitespace-nowrap">${label}</span><div class="flex-1 h-px bg-zinc-200 dark:bg-zinc-700"></div></div>`;
    }

    function renderMessage(msg, index) {
        const isUser = msg.role === 'user';
        const ts = formatTimestamp(msg.timestamp);

        if (isUser) {
            const textItems = msg.items.filter(i => i.type === 'text');
            if (!textItems.length) return '';
            const text = textItems.map(i=>i.text).join('\n');
            return `<div class="flex flex-col self-end max-w-[75%] items-end relative" data-msg-index="${index}" data-role="user" data-text="${escapeAttr(text)}" onclick="toggleMsgSelect(this, event)">
                <div class="text-[10px] font-mono text-zinc-400 mb-1">${ts}</div>
                <div class="bg-zinc-50 dark:bg-zinc-800/40 border border-zinc-200 dark:border-zinc-700/60 rounded-2xl rounded-tr-sm px-4 py-3 text-sm text-zinc-800 dark:text-zinc-200 leading-relaxed whitespace-pre-wrap msg-wrap">${linkifyUrls(escapeHtml(text))}</div>
                <div class="msg-select-check absolute -top-2 -right-2 w-5 h-5 items-center justify-center rounded-full bg-[#d97d54] text-white text-xs"><i class="ph ph-check"></i></div>
            </div>`;
        } else {
            const itemsHtml = msg.items.map(renderItem).join('');
            if (!itemsHtml.trim()) return '';
            const textItems = msg.items.filter(i => i.type === 'text');
            const text = textItems.map(i=>i.text).join('\n');
            return `<div class="flex flex-col self-start max-w-[85%] w-full relative pl-9 " data-msg-index="${index}" data-role="assistant" data-text="${escapeAttr(text)}" onclick="toggleMsgSelect(this, event)">
                <div class="absolute left-0 top-0 w-6 h-6 flex items-center justify-center rounded-md bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800">
                    <i class="ph ph-robot text-anthropic text-sm"></i>
                </div>
                <div class="flex flex-col gap-2">
                    <div class="text-[10px] font-mono text-zinc-400 ml-1">${ts}</div>
                    ${itemsHtml}
                </div>
                <div class="msg-select-check absolute -top-2 -left-2 w-5 h-5 items-center justify-center rounded-full bg-[#d97d54] text-white text-xs"><i class="ph ph-check"></i></div>
            </div>`;
        }
    }

    function escapeAttr(s) {
        return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function setPlaybackIcon(icon) {
        const el = document.getElementById('playback-icon');
        el.classList.remove('ph-play', 'ph-pause');
        el.classList.add(icon === 'pause' ? 'ph-pause' : 'ph-play');
    }

    function getPlaybackDelay() {
        return 1000 / playbackSpeed;
    }

    function revealNext() {
        const messages = document.querySelectorAll('#chat > [data-msg]');
        if (playbackIndex >= messages.length) {
            // Playback finished
            playbackState = 'idle';
            playbackIndex = 0;
            setPlaybackIcon('play');
            document.getElementById('stop-btn').classList.add('hidden');
            return;
        }
        const el = messages[playbackIndex];
        el.classList.remove('msg-hidden');
        el.classList.add('msg-animate');
        el.scrollIntoView({ behavior: 'smooth', block: 'end' });
        playbackIndex++;

        playbackTimer = setTimeout(revealNext, getPlaybackDelay());
    }

    function playbackPlay() {
        const messages = document.querySelectorAll('#chat > [data-msg]');
        if (!messages.length) return;

        if (playbackState === 'idle') {
            // Fresh start: hide all messages, reset index
            messages.forEach(el => {
                el.classList.remove('msg-visible', 'msg-animate');
                el.classList.add('msg-hidden');
            });
            playbackIndex = 0;
            document.getElementById('chat').scrollTop = 0;
        }
        // Start or resume
        playbackState = 'playing';
        setPlaybackIcon('pause');
        document.getElementById('stop-btn').classList.remove('hidden');
        revealNext();
    }

    function playbackPause() {
        playbackState = 'paused';
        if (playbackTimer) { clearTimeout(playbackTimer); playbackTimer = null; }
        setPlaybackIcon('play');
    }

    function playbackStop() {
        if (playbackTimer) { clearTimeout(playbackTimer); playbackTimer = null; }
        playbackState = 'idle';
        playbackIndex = 0;
        setPlaybackIcon('play');
        document.getElementById('stop-btn').classList.add('hidden');
        // Show all messages instantly
        document.querySelectorAll('#chat > [data-msg]').forEach(el => {
            el.classList.remove('msg-hidden', 'msg-animate');
            el.classList.add('msg-visible');
        });
    }

    function togglePlayback() {
        if (playbackState === 'playing') {
            playbackPause();
        } else {
            playbackPlay();
        }
    }

    function togglePlaybackPanel() {
        const panel = document.getElementById('playback-panel');
        const icon = document.getElementById('playback-toggle-icon');
        const isOpen = panel.style.maxHeight !== '0px' && panel.style.maxHeight !== '';
        if (isOpen) {
            panel.style.maxHeight = '0';
            icon.className = 'ph ph-caret-down text-sm';
        } else {
            panel.style.maxHeight = panel.scrollHeight + 'px';
            icon.className = 'ph ph-caret-up text-sm';
        }
    }

    async function reloadSession() {
        if (!currentSession) return;
        const btn = document.getElementById('reload-btn');
        const icon = btn.querySelector('i');
        // Spin animation
        icon.style.animation = 'spin 0.6s linear infinite';
        try {
            await loadSession(currentSession);
        } finally {
            icon.style.animation = '';
        }
    }

    async function loadSession(session) {
        // Stop any running playback
        playbackStop();
        if (quoteMode) toggleQuoteMode();

        currentSession = session;
        // Update header
        const titleEl = document.getElementById('session-title');
        titleEl.textContent = session.display_name || session.id;
        titleEl.title = session.display_name || session.id;
        document.getElementById('token-badge').classList.add('hidden');
        document.getElementById('rename-btn').classList.remove('hidden');
        // Show header row 2
        const row2 = document.getElementById('header-row2');
        row2.classList.remove('hidden');
        row2.classList.add('flex');
        document.getElementById('chat').innerHTML = `<div class="text-xs text-zinc-400 px-2">${t('loading')}</div>`;
        // Re-render sidebar to update active state
        renderSidebar(allSessions);

        const res = await fetch(`/api/sessions/${session.project_dir}/${session.id}`);
        const data = await res.json();

        const badge = document.getElementById('token-badge');
        if (data.total_tokens > 0) {
            badge.textContent = `${data.total_tokens.toLocaleString()} ${t('tokens')}`;
            badge.classList.remove('hidden');
        }
        let lastDateKey = '';
        const htmlParts = [];
        data.messages.forEach((msg, i) => {
            const dateKey = getDateKey(msg.timestamp);
            if (dateKey && dateKey !== lastDateKey) {
                htmlParts.push(renderDateSeparator(msg.timestamp));
                lastDateKey = dateKey;
            }
            const rendered = renderMessage(msg, i);
            if (rendered) htmlParts.push(rendered);
        });
        const html = htmlParts.join('');
        document.getElementById('chat').innerHTML = html || `<div class="text-zinc-400 text-sm text-center mt-20">${t('empty_state')}</div>`;

        // Wrap each message for playback control
        const chat = document.getElementById('chat');
        Array.from(chat.children).forEach(el => {
            el.setAttribute('data-msg', '1');
            el.classList.add('msg-visible');
        });

        // Apply search highlights if content search is active (2+ chars only)
        if (searchMode === 'content' && contentSearchQuery && contentSearchQuery.length >= 2) {
            applyHighlights(contentSearchQuery);
        }

        // Scroll to latest message after render completes
        requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });
    }

    // --- Search mode & content search ---

    function setSearchMode(mode) {
        searchMode = mode;
        const sessionTab = document.getElementById('search-tab-session');
        const contentTab = document.getElementById('search-tab-content');
        const input = document.getElementById('search');

        if (mode === 'session') {
            sessionTab.classList.add('border-anthropic', 'text-zinc-800', 'dark:text-zinc-100');
            sessionTab.classList.remove('border-transparent', 'text-zinc-400');
            contentTab.classList.remove('border-anthropic', 'text-zinc-800', 'dark:text-zinc-100');
            contentTab.classList.add('border-transparent', 'text-zinc-400');
            // Clear content search state
            contentSearchResults = null;
            contentSearchQuery = '';
            clearHighlights();
            document.getElementById('search-hit-count').classList.add('hidden');
        } else {
            contentTab.classList.add('border-anthropic', 'text-zinc-800', 'dark:text-zinc-100');
            contentTab.classList.remove('border-transparent', 'text-zinc-400');
            sessionTab.classList.remove('border-anthropic', 'text-zinc-800', 'dark:text-zinc-100');
            sessionTab.classList.add('border-transparent', 'text-zinc-400');
        }

        input.value = '';
        updateSearchPlaceholder();
        renderSidebar(allSessions);
        input.focus();
    }

    async function executeContentSearch(query) {
        if (!query.trim()) {
            contentSearchResults = null;
            contentSearchQuery = '';
            document.getElementById('search-hit-count').classList.add('hidden');
            clearHighlights();
            renderSidebar(allSessions);
            return;
        }

        // Show spinner
        document.getElementById('search-icon').classList.add('hidden');
        document.getElementById('search-spinner').classList.remove('hidden');

        try {
            const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
            const results = await res.json();
            contentSearchResults = results;
            contentSearchQuery = query;

            // Show hit count
            const totalHits = results.reduce((sum, r) => sum + r.hit_count, 0);
            const hitCountEl = document.getElementById('search-hit-count');
            hitCountEl.textContent = `${results.length} sessions / ${totalHits} hits`;
            hitCountEl.classList.remove('hidden');

            renderSidebar(allSessions);

            // If a session is currently open, apply highlights
            if (currentSession && contentSearchQuery) {
                applyHighlights(contentSearchQuery);
            }
        } catch (e) {
            console.error('Content search failed:', e);
        } finally {
            document.getElementById('search-spinner').classList.add('hidden');
            document.getElementById('search-icon').classList.remove('hidden');
        }
    }

    function applyHighlights(query) {
        if (!query) return;
        clearHighlights();
        const chat = document.getElementById('chat');
        const walker = document.createTreeWalker(chat, NodeFilter.SHOW_TEXT, null);
        const textNodes = [];
        while (walker.nextNode()) textNodes.push(walker.currentNode);

        const lowerQuery = query.toLowerCase();
        textNodes.forEach(node => {
            const text = node.textContent;
            const lowerText = text.toLowerCase();
            if (!lowerText.includes(lowerQuery)) return;

            const frag = document.createDocumentFragment();
            let lastIdx = 0;
            let idx = lowerText.indexOf(lowerQuery, lastIdx);
            while (idx !== -1) {
                if (idx > lastIdx) frag.appendChild(document.createTextNode(text.slice(lastIdx, idx)));
                const mark = document.createElement('mark');
                mark.className = 'search-hit';
                mark.textContent = text.slice(idx, idx + query.length);
                frag.appendChild(mark);
                lastIdx = idx + query.length;
                idx = lowerText.indexOf(lowerQuery, lastIdx);
            }
            if (lastIdx < text.length) frag.appendChild(document.createTextNode(text.slice(lastIdx)));
            node.parentNode.replaceChild(frag, node);
        });

        currentHighlightIndex = -1;
        updateHighlightNav();
    }

    function updateHighlightNav() {
        const marks = document.querySelectorAll('mark.search-hit');
        const nav = document.getElementById('highlight-nav');
        if (marks.length === 0) {
            nav.classList.add('hidden');
            return;
        }
        nav.classList.remove('hidden');
        const counter = document.getElementById('highlight-counter');
        if (currentHighlightIndex >= 0) {
            counter.textContent = `${currentHighlightIndex + 1}/${marks.length}`;
        } else {
            counter.textContent = `${marks.length} hits`;
        }
    }

    function jumpHighlight(direction) {
        const marks = document.querySelectorAll('mark.search-hit');
        if (marks.length === 0) return;

        // Remove current highlight
        if (currentHighlightIndex >= 0 && currentHighlightIndex < marks.length) {
            marks[currentHighlightIndex].classList.remove('current');
        }

        if (currentHighlightIndex < 0) {
            currentHighlightIndex = direction > 0 ? 0 : marks.length - 1;
        } else {
            currentHighlightIndex += direction;
            if (currentHighlightIndex >= marks.length) currentHighlightIndex = 0;
            if (currentHighlightIndex < 0) currentHighlightIndex = marks.length - 1;
        }

        marks[currentHighlightIndex].classList.add('current');
        marks[currentHighlightIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
        updateHighlightNav();
    }

    function clearHighlights() {
        document.querySelectorAll('mark.search-hit').forEach(mark => {
            const text = document.createTextNode(mark.textContent);
            mark.parentNode.replaceChild(text, mark);
        });
        currentHighlightIndex = -1;
        document.getElementById('highlight-nav').classList.add('hidden');
    }

    function groupSessions(sessions) {
        // group by project, then by date
        const byProject = {};
        sessions.forEach(s => {
            const key = s.project_dir;
            if (!byProject[key]) byProject[key] = { name: s.project, sessions: [] };
            byProject[key].sessions.push(s);
        });

        // within each project, group by date label
        for (const key of Object.keys(byProject)) {
            const dateGroups = {};
            byProject[key].sessions.forEach(s => {
                const label = formatDate(s.mtime);
                if (!dateGroups[label]) dateGroups[label] = [];
                dateGroups[label].push(s);
            });
            byProject[key].dateGroups = dateGroups;
        }
        return byProject;
    }

    function renderSidebar(sessions) {
        const query = document.getElementById('search').value.toLowerCase();

        // Content search mode: render search results view
        if (searchMode === 'content' && contentSearchResults) {
            renderSearchResults(sessions);
            return;
        }

        // Session name mode: incremental filter (existing behavior)
        const filtered = query
            ? sessions.filter(s =>
                s.display_name.toLowerCase().includes(query) ||
                s.first_text.toLowerCase().includes(query) ||
                s.project.toLowerCase().includes(query))
            : sessions;

        renderSessionList(filtered);
    }

    function renderSearchResults(sessions) {
        const sessionMap = {};
        sessions.forEach(s => { sessionMap[s.id] = s; });

        let html = '';
        contentSearchResults.forEach(result => {
            const session = sessionMap[result.session_id];
            if (!session) return;
            const name20 = session.display_name.length > 20 ? session.display_name.slice(0, 20) + '…' : session.display_name;
            const isActive = currentSession && currentSession.id === session.id;

            html += `<div class="mx-2 mb-2">
                <div class="flex items-center gap-1.5 px-2 py-1.5 rounded-md ${isActive ? 'bg-white dark:bg-zinc-700/60 border border-zinc-200 dark:border-zinc-600' : 'bg-zinc-200/70 dark:bg-zinc-700/40 border border-zinc-300/50 dark:border-zinc-600/30'}">
                    <i class="ph ph-chat-dots text-[11px] text-zinc-500 dark:text-zinc-400 flex-shrink-0"></i>
                    <span class="text-[11px] font-medium ${isActive ? 'text-zinc-900 dark:text-zinc-100' : 'text-zinc-700 dark:text-zinc-200'} truncate" title="${escapeHtml(session.display_name)}">${escapeHtml(name20)}</span>
                    <span class="text-[10px] font-mono text-zinc-500 dark:text-zinc-400 ml-auto flex-shrink-0">${result.hit_count} hits</span>
                </div>`;

            result.hits.forEach(hit => {
                const roleIcon = hit.role === 'user' ? 'ph-user' : 'ph-robot';
                const roleColor = hit.role === 'user' ? 'text-blue-400' : 'text-anthropic';
                html += `<div class="search-hit-item flex gap-1.5 px-3 py-1.5 cursor-pointer rounded hover:bg-zinc-100 dark:hover:bg-zinc-800/50 transition-colors"
                    data-session-id="${escapeHtml(session.id)}" data-project-dir="${escapeHtml(session.project_dir)}" data-msg-index="${hit.msg_index}">
                    <i class="ph ${roleIcon} ${roleColor} text-[10px] mt-0.5 flex-shrink-0"></i>
                    <span class="text-[11px] text-zinc-500 dark:text-zinc-400 leading-snug line-clamp-2">${escapeHtml(hit.snippet)}</span>
                </div>`;
            });

            html += `</div>`;
        });

        document.getElementById('session-list').innerHTML = html || `<div class="text-xs text-zinc-400 px-4 py-4">No results</div>`;
    }

    function renderSessionList(filtered) {
        const byProject = groupSessions(filtered);
        let html = '';

        for (const [key, { name, dateGroups }] of Object.entries(byProject)) {
            const isCollapsed = collapsedProjects.has(key);
            const shortName = '~/' + name.split('/').slice(-2).join('/');
            html += `<div class="mb-1">
                <button class="w-full flex items-center gap-1.5 text-[11px] font-mono text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-200 px-3 py-1.5 hover:bg-zinc-100 dark:hover:bg-zinc-800/50 transition-colors rounded-md"
                    onclick="toggleProject('${key}')">
                    <i class="ph ${isCollapsed ? 'ph-folder' : 'ph-folder-open'} flex-shrink-0"></i>
                    <span class="truncate text-left flex-1" title="${escapeHtml(name)}">${escapeHtml(shortName)}</span>
                    <i class="ph ph-caret-${isCollapsed ? 'right' : 'down'} text-[10px] flex-shrink-0"></i>
                </button>`;

            if (!isCollapsed) {
                for (const [dateLabel, dateSessions] of Object.entries(dateGroups)) {
                    html += `<div class="mx-2 mt-2 mb-1">
                        <div class="flex items-center gap-2 mb-1">
                            <div class="h-px flex-1 bg-zinc-200 dark:bg-zinc-800"></div>
                            <span class="text-[10px] font-mono text-zinc-400 dark:text-zinc-600 whitespace-nowrap px-1">${escapeHtml(dateLabel)}</span>
                            <div class="h-px flex-1 bg-zinc-200 dark:bg-zinc-800"></div>
                        </div>`;
                    dateSessions.forEach(s => {
                        const isActive = currentSession && currentSession.id === s.id;
                        const name20 = s.display_name.length > 20 ? s.display_name.slice(0, 20) + '…' : s.display_name;
                        const sessionJson = escapeHtml(JSON.stringify(s));
                        html += `<div class="relative flex flex-col px-2 py-2 mb-0.5 rounded-md cursor-pointer transition-colors ${isActive
                                ? 'bg-white dark:bg-zinc-800/60 border border-zinc-200 dark:border-zinc-700 shadow-sm'
                                : 'hover:bg-zinc-100 dark:hover:bg-zinc-800/30 border border-transparent'}"
                            onclick='selectSession(${sessionJson})'>
                            ${isActive ? '<div class="absolute left-0 top-1/2 -translate-y-1/2 w-0.5 h-4 bg-anthropic rounded-r-full"></div>' : ''}
                            <div class="text-[10px] font-mono text-zinc-400 dark:text-zinc-600 pl-1">
                                ${s.first_ts && s.last_ts && s.first_ts !== s.last_ts
                                    ? new Date(s.first_ts).toLocaleTimeString(lang==='ja'?'ja-JP':'en-US',{hour:'2-digit',minute:'2-digit'}) + '〜' + new Date(s.last_ts).toLocaleTimeString(lang==='ja'?'ja-JP':'en-US',{hour:'2-digit',minute:'2-digit'})
                                    : s.first_ts ? new Date(s.first_ts).toLocaleTimeString(lang==='ja'?'ja-JP':'en-US',{hour:'2-digit',minute:'2-digit'}) : ''}
                            </div>
                            <span class="text-xs ${isActive ? 'font-medium text-zinc-900 dark:text-zinc-100' : 'text-zinc-600 dark:text-zinc-400'} truncate pl-1" title="${escapeHtml(s.display_name)}">${escapeHtml(name20)}</span>
                        </div>`;
                    });
                    html += `</div>`;
                }
            }
            html += `</div>`;
        }

        document.getElementById('session-list').innerHTML = html || `<div class="text-xs text-zinc-400 px-4 py-4">No sessions found</div>`;
    }

    function toggleProject(key) {
        if (collapsedProjects.has(key)) collapsedProjects.delete(key);
        else collapsedProjects.add(key);
        renderSidebar(allSessions);
    }

    function selectSession(session) {
        clearSelection();
        loadSession(session);
        if (window.innerWidth < 768) toggleSidebar();
    }

    async function selectSearchHit(sessionId, projectDir, msgIndex) {
        const session = allSessions.find(s => s.id === sessionId && s.project_dir === projectDir);
        if (!session) return;

        // Load session only if different from current
        if (!currentSession || currentSession.id !== session.id) {
            await loadSession(session);
        }

        // Scroll to target message
        const target = document.querySelector(`[data-msg-index="${msgIndex}"]`);
        if (target) {
            // Clear previous flash
            document.querySelectorAll('.ring-2.ring-anthropic\\/50').forEach(el => {
                el.classList.remove('ring-2', 'ring-anthropic/50', 'rounded-lg');
            });
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            target.classList.add('ring-2', 'ring-anthropic/50', 'rounded-lg');
            setTimeout(() => target.classList.remove('ring-2', 'ring-anthropic/50', 'rounded-lg'), 2000);
        }
    }

    let reloading = false;
    async function reloadSessions() {
        if (reloading) return;
        reloading = true;
        // Reset search state
        contentSearchResults = null;
        contentSearchQuery = '';
        document.getElementById('search').value = '';
        document.getElementById('search-hit-count').classList.add('hidden');
        clearHighlights();
        if (searchMode === 'content') setSearchMode('session');

        const btn = document.getElementById('reload-btn');
        const icon = btn.querySelector('i');
        icon.classList.add('animate-spin');
        btn.disabled = true;
        try {
            const res = await fetch('/api/sessions');
            allSessions = await res.json();
            renderSidebar(allSessions);
        } finally {
            setTimeout(() => {
                icon.classList.remove('animate-spin');
                btn.disabled = false;
                reloading = false;
            }, 800);
        }
    }

    function openRenameModal() {
        if (!currentSession) return;
        const input = document.getElementById('rename-input');
        input.value = currentSession.display_name.slice(0, 30);
        updateRenameCount();
        document.getElementById('rename-modal').classList.remove('hidden');
        input.focus(); input.select();
    }

    function updateRenameCount() {
        const input = document.getElementById('rename-input');
        const count = document.getElementById('rename-count');
        const len = input.value.length;
        count.textContent = `${len}/30`;
        count.className = `absolute right-3 top-1/2 -translate-y-1/2 text-[11px] font-mono ${len >= 30 ? 'text-red-500' : 'text-zinc-400'}`;
    }

    async function saveRename() {
        if (!currentSession) return;
        const name = document.getElementById('rename-input').value.slice(0, 30).trim();
        await fetch(`/api/sessions/${currentSession.id}/rename`, {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({name})
        });
        currentSession.display_name = name || currentSession.first_text || currentSession.id;
        document.getElementById('session-title').textContent = currentSession.display_name;
        document.getElementById('rename-modal').classList.add('hidden');
        await reloadSessions();
    }

    async function init() {
        applyI18n();
        await reloadSessions();
    }

    // Theme: cycle through dark → light → auto
    const themes = ['dark', 'light', 'auto'];
    let themeMode = localStorage.getItem('theme') || 'auto';

    function applyTheme() {
        const html = document.documentElement;
        const li = document.getElementById('icon-light');
        const di = document.getElementById('icon-dark');
        const ai = document.getElementById('icon-auto');
        if (themeMode === 'dark') {
            html.classList.add('dark');
            li.classList.add('hidden'); di.classList.remove('hidden'); ai.classList.add('hidden');
        } else if (themeMode === 'light') {
            html.classList.remove('dark');
            li.classList.remove('hidden'); di.classList.add('hidden'); ai.classList.add('hidden');
        } else { // auto
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            prefersDark ? html.classList.add('dark') : html.classList.remove('dark');
            li.classList.add('hidden'); di.classList.add('hidden'); ai.classList.remove('hidden');
        }
        localStorage.setItem('theme', themeMode);
    }
    applyTheme();

    document.getElementById('theme-toggle').addEventListener('click', () => {
        themeMode = themes[(themes.indexOf(themeMode) + 1) % themes.length];
        applyTheme();
    });

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if (themeMode === 'auto') applyTheme();
    });
    document.getElementById('lang-toggle').addEventListener('click', () => {
        lang = lang === 'en' ? 'ja' : 'en';
        localStorage.setItem('lang', lang);
        applyI18n();
        renderSidebar(allSessions);
        if (currentSession) {
            document.getElementById('session-title').textContent = currentSession.display_name;
            loadSession(currentSession);
        }
    });
    // Quote names popover
    function toggleQuoteNamesPopover() {
        const pop = document.getElementById('quote-names-popover');
        const isHidden = pop.classList.contains('hidden');
        if (isHidden) {
            document.getElementById('quote-user-name').value = localStorage.getItem('quote_user_name') || '';
            document.getElementById('quote-agent-name').value = localStorage.getItem('quote_agent_name') || '';
            pop.classList.remove('hidden');
        } else {
            pop.classList.add('hidden');
        }
    }
    window.toggleQuoteNamesPopover = toggleQuoteNamesPopover;

    function saveQuoteNames() {
        const userName = document.getElementById('quote-user-name').value.trim();
        const agentName = document.getElementById('quote-agent-name').value.trim();
        if (userName) localStorage.setItem('quote_user_name', userName);
        else localStorage.removeItem('quote_user_name');
        if (agentName) localStorage.setItem('quote_agent_name', agentName);
        else localStorage.removeItem('quote_agent_name');
        document.getElementById('quote-names-popover').classList.add('hidden');
    }
    window.saveQuoteNames = saveQuoteNames;

    // Close popover on outside click
    document.addEventListener('click', (e) => {
        const pop = document.getElementById('quote-names-popover');
        const btn = document.getElementById('quote-names-btn');
        if (!pop.classList.contains('hidden') && !pop.contains(e.target) && !btn.contains(e.target)) {
            pop.classList.add('hidden');
        }
    });

    document.getElementById('search').addEventListener('input', () => {
        if (searchMode === 'session') {
            renderSidebar(allSessions);
        }
        // Content mode: no incremental search, wait for Enter
    });
    document.getElementById('search').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && searchMode === 'content') {
            executeContentSearch(e.target.value);
        }
    });
    document.getElementById('rename-btn').addEventListener('click', openRenameModal);
    document.getElementById('rename-close').addEventListener('click', () => document.getElementById('rename-modal').classList.add('hidden'));
    document.getElementById('rename-cancel').addEventListener('click', () => document.getElementById('rename-modal').classList.add('hidden'));
    document.getElementById('rename-save').addEventListener('click', saveRename);
    document.getElementById('rename-input').addEventListener('input', updateRenameCount);
    document.getElementById('rename-input').addEventListener('keydown', e => { if (e.key === 'Enter') saveRename(); if (e.key === 'Escape') document.getElementById('rename-modal').classList.add('hidden'); });
    document.getElementById('reload-btn').addEventListener('click', reloadSessions);
    document.getElementById('session-list').addEventListener('click', (e) => {
        const item = e.target.closest('.search-hit-item');
        if (item) {
            selectSearchHit(item.dataset.sessionId, item.dataset.projectDir, parseInt(item.dataset.msgIndex));
        }
    });
    document.getElementById('playback-btn').addEventListener('click', togglePlayback);
    document.getElementById('stop-btn').addEventListener('click', playbackStop);
    document.getElementById('speed-slider').addEventListener('input', (e) => {
        // Slider: 1-20, mapped to 0.05x - 4x
        // 1=0.05x, 5=0.25x, 10=1x, 15=2x, 20=4x (exponential scale)
        const v = parseInt(e.target.value);
        playbackSpeed = Math.pow(2, (v - 10) / 5);
        const label = playbackSpeed < 1
            ? playbackSpeed.toFixed(2) + 'x'
            : playbackSpeed.toFixed(1) + 'x';
        document.getElementById('speed-label').textContent = label;
    });

    init();
    </script>
</body>
</html>
